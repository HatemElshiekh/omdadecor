[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public by design: both ship in the browser bundle; RLS protects the data.
  # Secrets (service role, Anthropic key) live only in Supabase.
  VITE_SUPABASE_URL = "https://cvxwowtqmgpwlswawfgh.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2eHdvd3RxbWdwd2xzd2F3ZmdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzMzAxOTksImV4cCI6MjExMDkwNjE5OX0.JCP_oajZabyydi2ApbMHAWkVlwCIHquch-uQTsbNbJE"
  # These two are public values, so the secrets scanner must not fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# /_kit (component gallery) is exposed on deploy previews for PO review only.
# TEMPORARY (P1-P7): no real screens exist yet, so production also shows /_kit.
# Remove this block before the Phase 8 launch.
[context.production.environment]
  VITE_ENABLE_KIT = "true"

[context.deploy-preview.environment]
  VITE_ENABLE_KIT = "true"
[context.branch-deploy.environment]
  VITE_ENABLE_KIT = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
